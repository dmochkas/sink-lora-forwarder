[formats]
ok_fmt    = "%d(%F %T).%ms %V - %m%n"
error_fmt = "%d(%F %T).%ms %V (%F:%L) - %m%n"
rx_fmt    = "%d(%F %T).%ms %V - %m%n"

[rules]
# Positive / operational info
ok.DEBUG   >stdout;      ok_fmt

# Errors and warnings (stderr + file)
error.WARN >stderr;      error_fmt
error.WARN "errors.log"; error_fmt

# Received and forwarded content (trace)
rx.DEBUG   "rx.log";     rx_fmt
rx.INFO    "rx.log";     rx_fmt

# Capture WARN/ERROR logged to rx_cat as errors too
rx.WARN    >stderr;      error_fmt
rx.WARN    "errors.log"; error_fmt
rx.ERROR   >stderr;      error_fmt
rx.ERROR   "errors.log"; error_fmt
